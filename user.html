<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خزنة فولتشر الرقمية 🦅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main: #4a4ae2; --success: #28a745; --danger: #dc3545; --bg: #f0f2f5; --soft-red: #f87171; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* شاشة القفل المستقلة */
        #authOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--main); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: white; text-align: center; padding: 30px; box-sizing: border-box; }
        .auth-box { background: rgba(255,255,255,0.1); padding: 30px; border-radius: 25px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); width: 100%; max-width: 320px; }
        .auth-box input { width: 100%; padding: 15px; border-radius: 12px; border: none; text-align: center; font-size: 1.2rem; margin: 20px 0; outline: none; }
        .auth-box button { width: 100%; padding: 15px; border-radius: 12px; border: none; background: white; color: var(--main); font-weight: bold; cursor: pointer; font-size: 1.1rem; }

        /* البطاقة والمحتوى */
        #userContent { display: none; width: 100%; max-width: 400px; padding: 15px; box-sizing: border-box; }
        .card { background: white; border-radius: 25px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 8px solid var(--success); }
        .top-info { display: flex; justify-content: center; gap: 20px; padding: 20px; border-bottom: 1px solid #eee; align-items: center; }
        .date-box { border: 2.5px solid var(--danger); border-radius: 18px; padding: 10px; text-align: center; min-width: 85px; }
        .date-box b { font-size: 1.8rem; color: var(--soft-red); display: block; line-height: 1; }
        
        .prog-static { height: 18px; background: var(--success); border-radius: 10px; overflow: visible; margin: 15px 20px; position: relative; }
        .fill-red { height: 100%; background: var(--danger); width: 0%; float: right; border-radius: 0 10px 10px 0; position: relative; transition: 0.5s; }
        .running-person { position: absolute; left: -12px; top: -5px; color: white; font-size: 1.3rem; animation: run 0.4s infinite linear; }
        @keyframes run { 0%, 50%, 100% { transform: scaleX(-1) translateY(0) rotate(0deg); } 25% { transform: scaleX(-1) translateY(-3px) rotate(-10deg); } 75% { transform: scaleX(-1) translateY(-3px) rotate(10deg); } }

        .data-row { background: #f9f9f9; border-radius: 12px; padding: 12px; margin: 8px 20px; display: flex; justify-content: space-between; border: 1px solid #f0f0f0; align-items: center; }
        .data-label { font-size: 0.7rem; color: var(--soft-red); font-weight: bold; }
        .data-value { font-size: 0.85rem; font-weight: bold; color: #333; }
        
        .timer-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 15px 20px; direction: ltr; }
        .t-box { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 8px 2px; text-align: center; }
        .t-box b { display: block; color: var(--soft-red); font-size: 1.1rem; }

        .settings { padding: 15px 20px; border-top: 1px solid #eee; margin-top: 10px; text-align: center; }
        .settings input { padding: 8px; border-radius: 10px; border: 1px solid #ddd; width: 60%; text-align: center; margin-bottom: 5px; }
        .settings button { padding: 8px 15px; border-radius: 10px; border: none; background: var(--main); color: white; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="authOverlay">
    <div class="auth-box">
        <i class="fas fa-lock-open" style="font-size:4rem; margin-bottom:15px;"></i>
        <h2 id="authTitle">جاري التحميل...</h2>
        <p id="authMsg">مرحباً بك في نظام فولتشر 🦅</p>
        <input type="password" id="passInput" style="display:none;">
        <button id="authBtn" style="display:none;" onclick="processAuth()">فتح الصفحة</button>
    </div>
</div>

<div id="userContent">
    <div class="card">
        <div class="top-info">
            <div class="date-box">
                <span id="dayName" style="font-size:0.7rem; font-weight:bold; color:#666;"></span>
                <b id="dayNum"></b>
                <span id="monthName" style="font-size:0.7rem; font-weight:bold; color:#666;"></span>
            </div>
            <img id="userLogo" src="" style="width:70px; border-radius:12px;">
        </div>

        <div style="padding: 15px; text-align: center;">
            <div style="font-size:1.1rem;">مرحباً بك في أسرة <b style="color:var(--danger)">فولتشر 🦅</b></div>
            <div id="userName" style="font-weight:bold; margin-top:5px; font-size: 1.2rem; color:var(--main);"></div>
        </div>

        <div style="padding: 0 20px; text-align: right; font-weight: bold;">
            باقي <span id="daysCount" style="color:var(--danger); font-size:1.5rem; display:inline-block; animation: pulse 1.5s infinite;">0</span> يوم 🤝
        </div>
        <style>@keyframes pulse { 0%,100% {transform:scale(1);} 50% {transform:scale(1.1); text-shadow: 0 0 5px var(--danger);} }</style>

        <div class="prog-static"><div id="barConsumed" class="fill-red"><i class="fas fa-running running-person"></i></div></div>

        <div id="dataFields"></div>
        <div class="timer-grid" id="timerGrid"></div>

        <div class="settings">
            <p style="font-size: 0.75rem; color: #888; margin-bottom: 5px;">قفل الصفحة (خاص بك فقط)</p>
            <input type="password" id="changeInput" placeholder="رقم قفل جديد">
            <button onclick="updatePass()">تغيير القفل</button>
        </div>
    </div>
    <div style="text-align:center; padding: 20px; color:#aaa; font-size:0.7rem;">جميع الحقوق محفوظة - فولتشر 🦅</div>
</div>

<script>
    const DB = "https://aziztest-a0f6c-default-rtdb.firebaseio.com/.json";
    const MASTER = "Aztlg1512";
    let cloud = null, uIdx = -1, target = new URLSearchParams(window.location.search).get('name');

    // التاريخ الميلادي (الأحد 5 أبريل)
    const today = new Date();
    document.getElementById('dayNum').innerText = today.getDate();
    document.getElementById('dayName').innerText = today.toLocaleDateString('ar-EG', {weekday:'long'});
    document.getElementById('monthName').innerText = today.toLocaleDateString('ar-EG', {month:'long'});

    async function start() {
        const r = await fetch(DB); cloud = await r.json();
        uIdx = (cloud.clients || []).findIndex(u => u.name === target);
        const user = cloud.clients[uIdx];
        if(!user) return alert("المشترك غير موجود!");

        document.getElementById('passInput').style.display = 'block';
        document.getElementById('authBtn').style.display = 'block';

        // فحص حقل lock_code الجديد
        if(!user.lock_code || user.lock_code === "") {
            document.getElementById('authTitle').innerText = "إنشاء قفل للصفحة";
            document.getElementById('authMsg').innerText = "هذا أول دخول لك، يرجى كتابة رقم سري لتقفل به صفحتك وتحمي بياناتك";
            document.getElementById('passInput').placeholder = "اكتب رقم القفل الجديد";
        } else {
            document.getElementById('authTitle').innerText = "الصفحة مقفلة";
            document.getElementById('authMsg').innerText = "يرجى إدخال رقم القفل لفتح بياناتك";
            document.getElementById('passInput').placeholder = "رقم القفل";
        }
    }

    async function processAuth() {
        const val = document.getElementById('passInput').value;
        const user = cloud.clients[uIdx];
        
        // إذا لم يكن لديه قفل، نقوم بإنشائه الآن وحفظه في خانة lock_code
        if(!user.lock_code || user.lock_code === "") {
            if(val.length < 4) return alert("يرجى اختيار رقم من 4 خانات فأكثر");
            user.lock_code = val; 
            await sync(); 
            alert("✅ تم إنشاء قفل صفحتك بنجاح!"); 
            go(user);
        } else {
            // التحقق برقم العميل الخاص أو الماستر كي
            if(val === user.lock_code || val === MASTER) go(user);
            else alert("❌ رقم القفل غير صحيح!");
        }
    }

    function go(user) {
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('userContent').style.display = 'block';
        if(cloud.logo) document.getElementById('userLogo').src = cloud.logo;
        document.getElementById('userName').innerText = user.name;
        
        const tick = () => {
            const left = new Date(user.ce).getTime() - new Date().getTime();
            const total = new Date(user.ce).getTime() - new Date(user.cs).getTime();
            document.getElementById('daysCount').innerText = Math.max(0, Math.ceil(left/86400000));
            document.getElementById('barConsumed').style.width = Math.max(0, Math.min(100, 100-(left/total*100))) + "%";
            if(left > 0) {
                const s=Math.floor(left/1000), m=Math.floor(s/60), h=Math.floor(m/60), dL=Math.floor(h/24);
                const u = [['ثانية',s%60],['دقيقة',m%60],['ساعة',h%24],['يوم',dL%30],['شهر',Math.floor(dL/30)]];
                document.getElementById('timerGrid').innerHTML = u.map(x=>`<div class="t-box"><b>${x[1]}</b><span>${x[0]}</span></div>`).reverse().join('');
            }
        };
        tick(); setInterval(tick, 1000);
        
        // عرض البيانات التي وضعتها أنت في لوحة التحكم (اسم المستخدم والرقم السري للاشتراك)
        const fields = [
            ['رقم الجوال', user.cp],
            ['اسم المستخدم (الاشتراك)', user.cu],
            ['كلمة مرور (الاشتراك)', user.ck], // الحقل ck هنا هو بياناتك أنت
            ['تاريخ الانتهاء', user.ce]
        ];
        document.getElementById('dataFields').innerHTML = fields.map(x=>`
            <div class="data-row"><span class="data-label">${x[0]}</span><span class="data-value">${x[1]||'--'}</span></div>
        `).join('');
    }

    async function updatePass() {
        const p = document.getElementById('changeInput').value;
        if(p.length < 4) return alert("الرقم ضعيف!");
        cloud.clients[uIdx].lock_code = p; // تحديث خانة القفل فقط
        await sync(); 
        alert("✅ تم تحديث قفل الصفحة بنجاح!");
        document.getElementById('changeInput').value = "";
    }

    async function sync() { await fetch(DB, {method:'PUT', body: JSON.stringify(cloud)}); }
    start();
</script>
</body>
</html>
