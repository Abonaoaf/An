<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة اشتراك فولتشر 🦅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main: #4a4ae2; --success: #28a745; --danger: #dc3545; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; width: 100%; max-width: 400px; border-radius: 25px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 8px solid var(--success); }
        .top-info { display: flex; justify-content: center; gap: 20px; padding: 20px; border-bottom: 1px solid #eee; align-items: center; }
        .date-box { border: 2px solid var(--danger); border-radius: 15px; padding: 8px; text-align: center; min-width: 80px; }
        .main-logo { width: 70px; height: 70px; border-radius: 15px; object-fit: contain; }
        .welcome-msg { padding: 20px; text-align: center; }
        .v-family { color: var(--danger); font-weight: bold; font-size: 1.2rem; display: block; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .days-pulse { color: var(--danger); font-weight: 900; animation: pulse 1.5s infinite; display: inline-block; }
        .progress-bar-container { height: 14px; background: var(--success); border-radius: 10px; overflow: hidden; margin: 10px 20px; }
        .progress-fill-consumed { height: 100%; background: var(--danger); width: 0%; float: right; transition: 0.5s; }
        .data-row { background: #f9f9f9; border-radius: 12px; padding: 10px; margin: 5px 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        .btn { display: block; width: 80%; padding: 14px; border-radius: 12px; color: white; font-weight: bold; margin: 10px auto; text-decoration: none; text-align: center; }
        .btn-store { background: #5e4cc1; } .btn-support { background: var(--success); }
    </style>
</head>
<body>
<div class="card">
    <div class="top-info"><div class="date-box"><b id="dayNum"></b><br><span id="monthName"></span></div><img id="userLogo" src="" class="main-logo"></div>
    <div class="welcome-msg"><div>سعدنا بانضمامك معنا في <span class="v-family">أسرة فولتشر 🦅</span></div><div style="margin-top:10px;">مرحباً بك 🤝 <span id="userName" style="color:var(--main); font-weight:bold;">...</span></div></div>
    <div style="padding: 0 20px; text-align: right; font-weight: bold;">✅ ساري | باقي <span id="daysCount" class="days-pulse">0</span> يوم</div>
    <div class="progress-bar-container"><div id="barConsumed" class="progress-fill-consumed"></div></div>
    <div id="dataList"></div>
    <div style="padding: 20px;"><a href="https://wa.me/966594393012" class="btn btn-support">الدعم الفني</a><a href="store.html" class="btn btn-store">متجر التطبيقات</a></div>
</div>
<script>
    const DB_URL = "https://aziztest-a0f6c-default-rtdb.firebaseio.com/.json";
    const d = new Date();
    document.getElementById('dayNum').innerText = d.getDate();
    document.getElementById('monthName').innerText = d.toLocaleString('ar-SA', {month:'long'});
    async function load() {
        const name = new URLSearchParams(window.location.search).get('name');
        const res = await fetch(DB_URL);
        const data = await res.json();
        if(data.logo) document.getElementById('userLogo').src = data.logo;
        const user = (data.clients || []).find(u => u.name === name);
        if(user) {
            document.getElementById('userName').innerText = user.name;
            const up = () => {
                const now = new Date().getTime(), st = new Date(user.cs).getTime(), en = new Date(user.ce).getTime();
                const total = en - st, used = now - st;
                let p = Math.max(0, Math.min(100, (used / total) * 100));
                document.getElementById('barConsumed').style.width = p + "%";
                document.getElementById('daysCount').innerText = Math.max(0, Math.ceil((en - now) / (1000*60*60*24)));
            };
            up(); setInterval(up, 1000);
            const fields = [['تاريخ البداية', user.cs], ['تاريخ النهاية', user.ce], ['اسم المستخدم', user.cu], ['كلمة السر', user.ck]];
            document.getElementById('dataList').innerHTML = fields.map(f => `<div class="data-row"><span>${f[0]}</span><b>${f[1]}</b></div>`).join('');
        }
    }
    load();
</script>
</body>
</html>
