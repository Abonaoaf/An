<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة اشتراك فولتشر 🦅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --p: #1a202c; --s: #38a169; --d: #e53e3e; --bg: #f7fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: white; border-radius: 30px; padding: 35px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); border: 1px solid #eee; text-align: center; }
        .logo { font-size: 4rem; margin-bottom: 10px; }
        .user-name { color: #2d3748; font-size: 1.8rem; margin: 10px 0; }
        .progress-container { height: 14px; background: #edf2f7; border-radius: 10px; margin: 25px 0; overflow: hidden; position: relative; }
        .progress-fill { height: 100%; background: linear-gradient(to left, #48bb78, #38a169); transition: 1s linear; float: right; }
        .timer { display: flex; justify-content: center; gap: 8px; direction: ltr; margin: 20px 0; }
        .unit { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 15px; min-width: 55px; }
        .unit b { display: block; color: #3182ce; font-size: 1.3rem; }
        .unit span { font-size: 0.7rem; color: #718096; font-weight: bold; }
        .details { background: #f1f5f9; padding: 20px; border-radius: 20px; margin-top: 20px; text-align: right; }
        .details div { margin-bottom: 10px; font-size: 1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
        .btn-download { background: #1a202c; color: white; padding: 15px; border-radius: 15px; display: block; text-decoration: none; margin-top: 20px; font-weight: bold; transition: 0.3s; }
    </style>
</head>
<body>

<div class="card" id="userCard">
    <div class="logo">🦅</div>
    <div id="loading">جاري جلب بيانات اشتراكك...</div>
    
    <div id="content" style="display:none;">
        <h2 class="user-name" id="nameDisplay"></h2>
        <div class="progress-container"><div id="bar" class="progress-fill"></div></div>
        <div class="timer" id="timerDisplay"></div>
        
        <div class="details">
            <div><b><i class="fas fa-user"></i> المستخدم:</b> <span id="uDisplay"></span></div>
            <div><b><i class="fas fa-key"></i> كلمة السر:</b> <span id="pDisplay"></span></div>
        </div>
        
        <a href="#" id="linkDisplay" class="btn-download"><i class="fas fa-cloud-download-alt"></i> تحميل التطبيق</a>
    </div>
</div>

<script>
    const DB_URL = "https://aziztest-a0f6c-default-rtdb.firebaseio.com/.json";

    async function fetchUserData() {
        // الحصول على الاسم من الرابط (مثال: user.html?name=احمد)
        const params = new URLSearchParams(window.location.search);
        const nameFromUrl = params.get('name');

        if (!nameFromUrl) {
            document.getElementById('loading').innerHTML = "<b style='color:red'>رابط غير صالح!</b>";
            return;
        }

        try {
            const res = await fetch(DB_URL);
            const data = await res.json();
            const allUsers = data.clients || [];
            
            // البحث عن العميل بالاسم
            const user = allUsers.find(u => u.name === nameFromUrl);

            if (user) {
                showUser(user);
            } else {
                document.getElementById('loading').innerHTML = "<b style='color:red'>المشترك غير موجود في السحابة</b>";
            }
        } catch (e) {
            document.getElementById('loading').innerHTML = "فشل الاتصال بالسحابة";
        }
    }

    function showUser(user) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        document.getElementById('nameDisplay').innerText = user.name;
        document.getElementById('uDisplay').innerText = user.cu;
        document.getElementById('pDisplay').innerText = user.ck;
        document.getElementById('linkDisplay').href = user.cl;

        const update = () => {
            const now = new Date().getTime(), start = new Date(user.cs).getTime(), end = new Date(user.ce).getTime();
            const remain = end - now;
            let percent = ((remain) / (end - start)) * 100;
            percent = Math.max(0, Math.min(100, percent));
            
            document.getElementById('bar').style.width = percent + "%";

            if (remain <= 0) {
                document.getElementById('timerDisplay').innerHTML = "<h3 style='color:red'>الاشتراك منتهي ❌</h3>";
                return;
            }

            const s = Math.floor(remain/1000), m = Math.floor(s/60), h = Math.floor(m/60), d = Math.floor(h/24);
            document.getElementById('timerDisplay').innerHTML = `
                <div class="unit"><b>${d}</b><span>يوم</span></div>
                <div class="unit"><b>${h%24}</b><span>ساعة</span></div>
                <div class="unit"><b>${m%60}</b><span>دقيقة</span></div>
                <div class="unit"><b>${s%60}</b><span>ثانية</span></div>`;
        };
        update();
        setInterval(update, 1000);
    }

    fetchUserData();
</script>
</body>
</html>
