<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة اشتراك فولتشر 🦅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main: #4a4ae2; --success: #28a745; --danger: #dc3545; --bg: #f0f2f5; --wa: #075E54; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; min-height: 100vh; }
        .card { background: white; width: 100%; max-width: 400px; border-radius: 25px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 8px solid var(--success); }
        
        /* الهيدر والتاريخ ببرواز أحمر */
        .top-info { display: flex; justify-content: center; gap: 20px; padding: 20px; border-bottom: 1px solid #eee; align-items: center; }
        .date-box { background: #fff; border: 2px solid var(--danger); border-radius: 15px; padding: 8px 15px; text-align: center; min-width: 80px; box-shadow: 0 4px 8px rgba(220, 53, 69, 0.1); }
        .date-box span { display: block; font-size: 0.7rem; color: #666; }
        .date-box b { font-size: 1.2rem; color: #333; }
        .main-logo { width: 70px; height: 70px; border-radius: 15px; object-fit: contain; }

        /* رسالة الترحيب */
        .welcome-msg { padding: 15px 20px; text-align: center; line-height: 1.8; }
        .v-family { color: var(--danger); font-weight: bold; font-size: 1.2rem; display: block; margin-top: 5px; }
        .u-line { font-size: 1rem; color: #444; margin-top: 10px; white-space: nowrap; }
        .u-name-highlight { color: var(--main); font-weight: bold; font-size: 1.1rem; }

        /* تأثير النبض للعبارة */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .status-pulse { 
            display: inline-block;
            color: var(--success); 
            font-weight: bold; 
            font-size: 0.85rem;
            animation: pulse 2s infinite ease-in-out; 
        }

        .status-container { padding: 0 20px; text-align: right; }
        .progress-bar-container { height: 14px; background: var(--success); border-radius: 10px; overflow: hidden; margin: 10px 0; position: relative; }
        .progress-fill-consumed { height: 100%; background: var(--danger); width: 0%; float: right; transition: 0.5s; }
        
        /* بيانات الاشتراك */
        .data-section { padding: 0 20px; }
        .data-row { background: #f9f9f9; border-radius: 12px; padding: 10px 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #f0f0f0; }
        .data-label { font-size: 0.7rem; color: #888; }
        .data-value { font-size: 0.85rem; font-weight: bold; color: #333; word-break: break-all; }
        .copy-btn { color: var(--main); cursor: pointer; padding: 5px; font-size: 1rem; }

        /* عداد الوقت */
        .timer-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 10px 0; direction: ltr; }
        .t-box { background: #fff; border: 1px solid #eef; border-radius: 10px; padding: 8px 2px; text-align: center; }
        .t-box b { display: block; color: var(--main); font-size: 1rem; }
        .t-box span { font-size: 0.55rem; color: #aaa; }

        .action-btns { padding: 20px; }
        .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; color: white; font-weight: bold; margin-bottom: 10px; text-decoration: none; text-align: center; font-size: 0.9rem; transition: 0.3s; }
        .btn-store { background: #5e4cc1; }
        .btn-support { background: var(--success); }
        .btn-wa-channel { background: var(--wa); }
    </style>
</head>
<body>

<div class="card">
    <div class="top-info">
        <div class="date-box"><span id="dayName"></span><b id="dayNum"></b><span id="monthName"></span></div>
        <img id="userLogo" src="https://cdn-icons-png.flaticon.com/512/5359/5359051.png" class="main-logo">
    </div>

    <div class="welcome-msg">
        <div>سعدنا بانضمامك معنا في<span class="v-family">أسرة فولتشر 🦅</span></div>
        <div class="u-line">مرحباً بك معنا 🤝 <span id="userName" class="u-name-highlight">...</span></div>
    </div>

    <div class="status-container">
        <span class="status-pulse">✅ اشتراك ساري ومفعل</span>
        <div class="progress-bar-container"><div id="barConsumed" class="progress-fill-consumed"></div></div>
    </div>

    <div class="data-section">
        <div class="data-row"><div><span class="data-label">تاريخ البداية</span><div class="data-value" id="dStart">--</div></div></div>
        <div class="data-row"><div><span class="data-label">تاريخ النهاية</span><div class="data-value" id="dEnd">--</div></div></div>
        <div class="data-row"><div><span class="data-label">الجوال</span><div class="data-value" id="vPhone">--</div></div><i class="far fa-copy copy-btn" onclick="copy('vPhone')"></i></div>
        <div class="data-row"><div><span class="data-label">اسم المستخدم</span><div class="data-value" id="vUser">--</div></div><i class="far fa-copy copy-btn" onclick="copy('vUser')"></i></div>
        <div class="data-row"><div><span class="data-label">كلمة السر</span><div class="data-value" id="vPass">--</div></div><i class="far fa-copy copy-btn" onclick="copy('vPass')"></i></div>
        <div class="data-row"><div><span class="data-label">رابط الدخول</span><div class="data-value" id="vLink" style="font-size:0.7rem;">--</div></div><i class="far fa-copy copy-btn" onclick="copy('vLink')"></i></div>
        
        <div class="timer-grid" id="timerGrid"></div>
    </div>

    <div class="action-btns">
        <a href="https://wa.me/966594393012" class="btn btn-support"><i class="fab fa-whatsapp"></i> الدعم الفني المباشر</a>
        <a href="https://whatsapp.com/channel/0029VaFYcHcAO7RGw0O0QM1E" class="btn btn-wa-channel"><i class="fas fa-bullhorn"></i> قناة فولتشر بالواتساب</a>
        <a href="store.html" class="btn btn-store"><i class="fas fa-th-large"></i> متجر تطبيقات فولتشر</a>
    </div>
</div>

<script>
    const DB_URL = "https://aziztest-a0f6c-default-rtdb.firebaseio.com/.json";
    const d = new Date();
    const days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
    const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
    document.getElementById('dayName').innerText = days[d.getDay()];
    document.getElementById('dayNum').innerText = d.getDate();
    document.getElementById('monthName').innerText = months[d.getMonth()];

    async function load() {
        const name = new URLSearchParams(window.location.search).get('name');
        if(!name) return;
        try {
            const res = await fetch(DB_URL);
            const data = await res.json();
            if(data && data.logo) document.getElementById('userLogo').src = data.logo;
            const user = (data.clients || []).find(u => u.name === name);
            if(user) {
                document.getElementById('userName').innerText = user.name;
                document.getElementById('dStart').innerText = user.cs;
                document.getElementById('dEnd').innerText = user.ce;
                document.getElementById('vPhone').innerText = user.cp;
                document.getElementById('vUser').innerText = user.cu;
                document.getElementById('vPass').innerText = user.ck;
                document.getElementById('vLink').innerText = user.cl;
                
                const up = () => {
                    const n = new Date().getTime(), st = new Date(user.cs).getTime(), en = new Date(user.ce).getTime();
                    const r = en - n, tot = en - st;
                    let cp = Math.max(0, Math.min(100, ((n - st) / tot) * 100));
                    document.getElementById('barConsumed').style.width = cp + "%";
                    
                    const sec=Math.floor(r/1000), min=Math.floor(sec/60), hr=Math.floor(min/60), day=Math.floor(hr/24);
                    const units = [['ثانية', sec%60], ['دقيقة', min%60], ['ساعة', hr%24], ['يوم', day%30], ['شهر', Math.floor(day/30)]];
                    document.getElementById('timerGrid').innerHTML = r > 0 ? units.map(u => `<div class="t-box"><b>${u[1]}</b><span>${u[0]}</span></div>`).reverse().join('') : "<b style='grid-column:span 5; color:red'>منتهي</b>";
                };
                up(); setInterval(up, 1000);
            }
        } catch(e) { console.error("Error"); }
    }
    function copy(id) { navigator.clipboard.writeText(document.getElementById(id).innerText); alert("تم النسخ!"); }
    load();
</script>
</body>
</html>
