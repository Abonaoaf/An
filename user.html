<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة اشتراك فولتشر 🦅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main: #4a4ae2; --success: #28a745; --danger: #dc3545; --bg: #f0f2f5; --wa: #075E54; --soft-red: #f87171; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* شاشة القفل الذكية */
        #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .lock-card { background: white; padding: 35px 20px; border-radius: 25px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 8px solid var(--main); }
        .pin-input { width: 80%; padding: 15px; border-radius: 15px; border: 2px solid #ddd; text-align: center; font-size: 1.5rem; margin: 20px 0; outline: none; transition: 0.3s; }
        .pin-input:focus { border-color: var(--main); }
        
        .card { background: white; width: 100%; max-width: 400px; border-radius: 25px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 8px solid var(--success); }
        .top-info { display: flex; justify-content: center; gap: 20px; padding: 20px; border-bottom: 1px solid #eee; align-items: center; }
        .date-box { border: 2.5px solid var(--danger); border-radius: 18px; padding: 10px 15px; text-align: center; min-width: 90px; display: flex; flex-direction: column; }
        .date-box b { font-size: 1.8rem; color: #f87171; line-height: 1; }
        .main-logo { width: 70px; height: auto; border-radius: 15px; object-fit: contain; }
        
        .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; color: white; font-weight: bold; margin-bottom: 10px; text-decoration: none; text-align: center; cursor: pointer; border: none; font-size: 1rem; }
        .btn-main { background: var(--main); }
        .btn-support { background: var(--success); }
        .footer-rights { margin-top: 20px; text-align: center; color: #aaa; font-size: 0.75rem; }
        
        .data-row { background: #f9f9f9; border-radius: 12px; padding: 10px 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #f0f0f0; }
        .data-label { font-size: 0.75rem; color: var(--soft-red); font-weight: 600; }
        .data-value { font-size: 0.85rem; font-weight: bold; color: #333; }
        .copy-btn { color: var(--soft-red); cursor: pointer; }

        .timer-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 15px 20px; direction: ltr; }
        .t-box { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 8px 2px; text-align: center; }
        .t-box b { display: block; color: var(--soft-red); font-size: 1.1rem; }
        .t-box span { font-size: 0.6rem; color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div id="lockScreen">
    <div class="lock-card">
        <i id="lockIcon" class="fas fa-user-shield" style="font-size: 3.5rem; color: var(--main);"></i>
        <h2 id="lockTitle">تحقق من الهوية</h2>
        <p id="lockDesc">يرجى إدخال الرمز السري الخاص بك</p>
        <input type="password" id="pinInput" class="pin-input" placeholder="****">
        <button onclick="handleAuth()" id="authBtn" class="btn btn-main">دخول</button>
        <div id="errorMsg" style="color:var(--danger); margin-top:15px; font-weight:bold; display:none;"></div>
    </div>
</div>

<div class="card">
    <div class="top-info">
        <div class="date-box">
            <span id="dayName" style="font-size:0.75rem; color:#666; font-weight:bold;"></span>
            <b id="dayNum"></b>
            <span id="monthName" style="font-size:0.75rem; color:#666; font-weight:bold;"></span>
        </div>
        <img id="userLogo" src="https://cdn-icons-png.flaticon.com/512/5359/5359051.png" class="main-logo">
    </div>

    <div style="padding: 20px; text-align: center;">
        <div style="font-size: 1.1rem;">مرحباً بك <span id="userName" style="font-weight:bold; color:#000;">...</span></div>
        <div style="color:var(--danger); font-weight:bold; font-size: 1.2rem; margin-top:5px;">أسرة فولتشر 🦅</div>
    </div>

    <div id="dataFields" style="padding: 0 20px;"></div>
    <div id="timerGrid" class="timer-grid"></div>

    <div style="padding: 15px 20px;">
        <a href="https://wa.me/966594393012" class="btn btn-support"><i class="fab fa-whatsapp"></i> الدعم الفني المباشر</a>
    </div>
</div>

<div class="footer-rights">أبو نواف - فولتشر 🦅<br>جميع الحقوق محفوظة 2026 ©</div>

<script>
    const DB_BASE_URL = "https://aziztest-a0f6c-default-rtdb.firebaseio.com/";
    let clientIdx = -1;
    let currentUser = null;

    // تحديث التاريخ
    const d = new Date();
    document.getElementById('dayNum').innerText = d.getDate();
    document.getElementById('dayName').innerText = d.toLocaleString('ar-SA', {weekday: 'long'});
    document.getElementById('monthName').innerText = d.toLocaleString('ar-SA', {month: 'long'});

    async function load() {
        const urlParams = new URLSearchParams(window.location.search);
        const targetName = urlParams.get('name');
        if(!targetName) return;

        try {
            const res = await fetch(DB_BASE_URL + ".json");
            const data = await res.json();
            
            clientIdx = (data.clients || []).findIndex(u => u.name === targetName);
            if(clientIdx !== -1) {
                currentUser = data.clients[clientIdx];
                document.getElementById('userName').innerText = currentUser.name;
                if(data.logo) document.getElementById('userLogo').src = data.logo;

                // إذا كانت خانة الرمز السري الخاص (private_pin) غير موجودة في السحابة
                if (!currentUser.private_pin) {
                    document.getElementById('lockIcon').className = "fas fa-user-plus";
                    document.getElementById('lockTitle').innerText = "ضبط رمز جديد";
                    document.getElementById('lockDesc').innerText = "أهلاً بك! يرجى اختيار رقم سري خاص بك لاستخدامه دائماً في فتح هذه الصفحة.";
                    document.getElementById('authBtn').innerText = "حفظ الرمز وفتح الصفحة";
                }
            }
        } catch(e) { console.error(e); }
    }

    async function handleAuth() {
        const pinValue = document.getElementById('pinInput').value.trim();
        if(pinValue.length < 2) {
            showErr("يرجى إدخال رمز صحيح (رقمين على الأقل)");
            return;
        }

        // الحالة الأولى: العميل يختار رقماً لأول مرة
        if (!currentUser.private_pin) {
            try {
                // حفظ الرمز في خانة جديدة (private_pin) في السحابة
                await fetch(`${DB_BASE_URL}clients/${clientIdx}/private_pin.json`, {
                    method: 'PUT',
                    body: JSON.stringify(pinValue)
                });
                currentUser.private_pin = pinValue;
                unlockPage();
            } catch(e) { showErr("فشل الاتصال بالسحابة لحفظ الرمز"); }
        } 
        // الحالة الثانية: العميل يدخل الرمز المحفوظ مسبقاً
        else {
            if (pinValue === currentUser.private_pin) {
                unlockPage();
            } else {
                showErr("الرمز السري غير صحيح!");
            }
        }
    }

    function unlockPage() {
        document.getElementById('lockScreen').style.display = 'none';
        renderContent();
    }

    function showErr(t) {
        const e = document.getElementById('errorMsg');
        e.innerText = t; e.style.display = 'block';
    }

    function renderContent() {
        // عرض البيانات الأصلية من الاشتراك (ck, cp, cu)
        const fields = [
            ['الجوال', currentUser.cp || '--'], 
            ['اسم المستخدم', currentUser.cu || '--'], 
            ['كلمة مرور الاشتراك', currentUser.ck || '--'], 
            ['تاريخ النهاية', currentUser.ce || '--']
        ];
        
        document.getElementById('dataFields').innerHTML = fields.map((f, i) => `
            <div class="data-row">
                <div><span class="data-label">${f[0]}</span><div class="data-value" id="val${i}">${f[1]}</div></div>
                <i class="far fa-copy copy-btn" onclick="copyText('val${i}')"></i>
            </div>
        `).join('');

        const updateTimer = () => {
            const now = new Date().getTime(), end = new Date(currentUser.ce).getTime();
            const left = end - now;
            if(left > 0) {
                const s=Math.floor(left/1000), m=Math.floor(s/60), h=Math.floor(m/60), dL=Math.floor(h/24);
                const units = [['ثانية', s%60], ['دقيقة', m%60], ['ساعة', h%24], ['يوم', dL%30], ['شهر', Math.floor(dL/30)]];
                document.getElementById('timerGrid').innerHTML = units.map(u => `<div class="t-box"><b>${u[1]}</b><span>${u[0]}</span></div>`).reverse().join('');
            }
        };
        updateTimer(); setInterval(updateTimer, 1000);
    }

    function copyText(id) {
        navigator.clipboard.writeText(document.getElementById(id).innerText);
        alert("تم نسخ النص!");
    }

    load();
</script>
</body>
</html>
