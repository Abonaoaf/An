<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة اشتراك فولتشر 🦅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --main: #4a4ae2;
            --success: #28a745;
            --danger: #dc3545;
            --bg: #f0f2f5;
            --wa: #075E54;
            --soft-red: #f87171;
            --v-badge-bg: rgba(220, 53, 69, 0.05); 
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* البطاقة الرئيسية */
        .card {
            display: none;
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-top: 8px solid var(--success);
        }

        .top-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            border-bottom: 1px solid #eee;
            align-items: center;
        }

        /* --- تعديل التباعد في كامل قسم الترحيب --- */
        .welcome-msg {
            padding: 30px 20px; /* زيادة الحشو الداخلي للمكان كامل */
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px; /* هذه الخاصية تضيف مسافة ثابتة وموحدة بين كل سطر والآخر */
            align-items: center;
        }

        .welcome-line-1 {
            font-size: 1.2rem;
            color: #333;
        }

        .welcome-line-2 {
            font-size: 1.05rem;
            color: #666;
        }
        
        /* تصميم أيقونة أسرة فولتشر */
        .v-badge {
            margin-top: 5px; /* مسافة إضافية بسيطة للسطر الأخير */
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: var(--v-badge-bg);
            color: var(--danger);
            padding: 12px 25px;
            border-radius: 50px;
            border: 1.5px solid rgba(220, 53, 69, 0.15);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.08);
        }

        .v-family-text {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: 0.5px;
        }

        .v-icon {
            font-size: 1.6rem;
        }
        /* ---------------------------------- */

        .u-name-highlight {
            color: #000;
            font-weight: bold;
        }

        /* الرسوم المتحركة وباقي التنسيقات */
        @keyframes warmHandshake {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.3); }
            80% { transform: scale(1.15); }
        }
        .pulsing-handshake {
            display: inline-block;
            animation: warmHandshake 2s infinite ease-in-out;
        }

        .status-line {
            font-weight: bold;
            font-size: 0.95rem;
            color: #333;
            padding: 0 20px;
            text-align: right;
        }
        .prog-static {
            height: 14px;
            background: var(--success);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 20px;
        }
        .fill-red {
            height: 100%;
            background: var(--danger);
            width: 0%;
            float: right;
        }
        .data-section { padding: 0 20px; }
        .data-row {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 10px 15px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #f0f0f0;
        }
        .data-label { font-size: 0.75rem; color: var(--soft-red); font-weight: 600; display: block; }
        .data-value { font-size: 0.85rem; font-weight: bold; color: #333; }
        .copy-btn { color: var(--soft-red); cursor: pointer; padding: 5px; }

        .action-btns { padding: 10px 25px 25px 25px; }
        .btn {
            display: block; width: 100%; padding: 14px; border-radius: 12px;
            color: white; font-weight: bold; margin-bottom: 12px;
            text-decoration: none; text-align: center; border: none; cursor: pointer;
        }
        .btn-support { background: var(--success); }
        .btn-wa-channel { background: var(--wa); }
        .btn-store { background: #5e4cc1; }
    </style>
</head>
<body>

<div id="mainCard" class="card" style="display: block;"> <div class="top-info">
        <div class="date-box">
            <span id="dayName" style="font-size:0.75rem; color:#666; font-weight:bold;">الأحد</span>
            <b id="dayNum" style="font-size: 1.8rem; color: #f87171;">15</b>
            <span id="monthName" style="font-size:0.75rem; color:#666; font-weight:bold;">أبريل</span>
        </div>
        <img src="https://via.placeholder.com/70" class="main-logo">
    </div>

    <div class="welcome-msg">
        <div class="welcome-line-1">
            مرحباً بك <span class="pulsing-handshake">🤝</span> 
            <span class="u-name-highlight">عبدالعزيز موسى الفيفي</span>
        </div>
        
        <div class="welcome-line-2">سعدنا بانضمامك معنا في</div>
        
        <div class="v-badge">
            <span class="v-icon">🦅</span>
            <span class="v-family-text">أسرة فولتشر</span>
        </div>
    </div>

    <div class="status-line">✅ اشتراك ساري</div>
    <div class="prog-static"><div class="fill-red" style="width: 20%;"></div></div>
    
    <div class="action-btns">
        <a href="#" class="btn btn-support">الدعم الفني المباشر</a>
        <a href="#" class="btn btn-wa-channel">قناة فولتشر بالواتساب</a>
        <a href="#" class="btn btn-store">متجر تطبيقات فولتشر</a>
    </div>
</div>

</body>
</html>
