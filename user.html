<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة اشتراك فولتشر 🦅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --main: #4a4ae2;
            --success: #28a745;
            --danger: #dc3545;
            --bg: #f0f2f5;
            --wa: #075E54;
            --soft-red: #f87171;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #lockScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lock-card {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            width: 90%;
            max-width: 360px;
            border: 1px solid #e2e8f0;
        }

        .lock-card input {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            text-align: center;
            font-size: 1.2rem;
            box-sizing: border-box;
            letter-spacing: 4px;
        }

        .lock-card button {
            width: 100%;
            padding: 14px;
            background: var(--main);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .client-container {
            width: 100%;
            max-width: 420px;
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .profile-card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid #edf2f7;
            text-align: center;
            position: relative;
        }

        .logo-area { margin-bottom: 10px; }
        .logo-area img { max-width: 100%; height: auto; object-fit: contain; }

        .badge-status {
            background: #ebf8ff;
            color: #2b6cb0;
            padding: 6px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
        }

        .days-highlight-box {
            background: #fff5f5;
            border: 1px dashed var(--soft-red);
            border-radius: 16px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
        }
        .days-highlight-box h2 { margin: 0; color: var(--danger); font-size: 2.2rem; font-weight: 900; }
        .days-highlight-box p { margin: 5px 0 0 0; color: #718096; font-size: 0.9rem; }

        .prog-bar {
            height: 12px;
            background: var(--success);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #edf2f7;
            margin-bottom: 10px;
        }
        .prog-consumed {
            height: 100%;
            background: var(--danger);
            float: right;
            width: 0%;
            transition: width 0.5s ease;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-top: 15px;
        }
        .t-box {
            background: #f7fafc;
            border-radius: 10px;
            padding: 8px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #edf2f7;
        }
        .t-box b { font-size: 1rem; color: #2d3748; }
        .t-box span { font-size: 0.65rem; color: #a0aec0; margin-top: 2px; }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f7fafc;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { font-size: 0.85rem; color: #718096; font-weight: bold; }
        .info-value { font-size: 0.9rem; color: #2d3748; font-weight: bold; text-align: left; word-break: break-all; max-width: 65%; }

        .btn-download {
            background: var(--main);
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.05rem;
            box-shadow: 0 4px 12px rgba(74, 74, 226, 0.2);
            transition: 0.3s;
        }

        .btn-store {
            background: #5e4cc1;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 5px;
        }

        .btn-reset-pin {
            background: transparent;
            color: #a0aec0;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 10px;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div id="lockScreen">
    <div class="lock-card">
        <i class="fas fa-lock" style="font-size: 3rem; color: var(--main);"></i>
        <h3 style="margin: 15px 0 5px 0; color:#2d3748;">رمز التحقق الخاص</h3>
        <p style="margin:0; font-size:0.85rem; color:#718096;">يرجى تعيين أو إدخال رمز الدخول السري</p>
        <input type="password" id="pinInput" placeholder="----" pattern="\d*"/>
        <button onclick="verifyPin()">تأكيد الدخول</button>
        <p id="lockMsg" style="color:var(--danger); font-size:0.85rem; margin-top:10px; display:none;"></p>
    </div>
</div>

<div class="client-container" id="clientContent">
    <div class="profile-card">
        <div class="logo-area" id="logoContainer">
            <img id="logoImg" src="" style="width: 70px; display: none;">
        </div>
        <h3 style="margin: 5px 0;" id="clientName">---</h3>
        <span class="badge-status">حساب نشط ومؤمن</span>

        <div class="days-highlight-box">
            <h2 id="daysCount">0</h2>
            <p>يوم متبقي على نهاية الاشتراك</p>
        </div>

        <div class="prog-bar"><div class="prog-consumed" id="barConsumed"></div></div>
        <div class="timer-grid" id="timerGrid"></div>
    </div>

    <div class="profile-card" style="text-align: right;">
        <h4 style="margin: 0 0 10px 0; color: #2d3748; border-bottom: 2px solid #f7fafc; padding-bottom: 8px;">بيانات الحساب</h4>
        <div class="info-row"><span class="info-label">اسم المستخدم:</span><span class="info-value" id="infoUser">---</span></div>
        <div class="info-row"><span class="info-label">كلمة المرور:</span><span class="info-value" id="infoPass">---</span></div>
        <div class="info-row"><span class="info-label">تاريخ نهاية الاشتراك:</span><span class="info-value" id="infoEnd">---</span></div>
    </div>

    <div id="activeLinksContainer"></div>

    <a id="storeBtn" href="#" class="btn-store">
        <i class="fas fa-store"></i> متجر التطبيقات فولتشر
    </a>

    <button class="btn-reset-pin" onclick="triggerReset()">إعادة تعيين رمز التحقق للجهاز</button>
</div>

<script>
    const DB_URL = "https://aziztest-a0f6c-default-rtdb.firebaseio.com/.json";
    let cloudData = null;
    let clientIdx = -1;
    let user = null;

    function getParam(name) { return new URLSearchParams(window.location.search).get(name); }

    async function init() {
        const nameParam = getParam('name');
        if(!nameParam) { msg("رابط غير صالح - اسم المشترك مفقود"); return; }

        try {
            const r = await fetch(DB_URL);
            cloudData = await r.json();
            if(!cloudData || !cloudData.clients) { msg("خطأ في جلب البيانات من السحابة"); return; }

            clientIdx = cloudData.clients.findIndex(c => c && c.name === nameParam);
            if(clientIdx === -1) { msg("المشترك غير مسجل في النظام"); return; }

            user = cloudData.clients[clientIdx];

            if(cloudData.logo) {
                const img = document.getElementById('logoImg');
                img.src = cloudData.logo;
                img.style.width = (cloudData.logoSize || 70) + "px";
                img.style.display = "inline-block";
            }

            if(!user.private_pin) {
                document.getElementById('lockScreen').style.display = "flex";
            } else {
                const savedPin = localStorage.getItem(`vulture_pin_${user.name}`);
                if(savedPin === user.private_pin) {
                    showDashboard();
                } else {
                    document.getElementById('lockScreen').style.display = "flex";
                }
            }
        } catch(e) { msg("فشل الاتصال بقاعدة البيانات السحابية"); }
    }

    async function verifyPin() {
        const pin = document.getElementById('pinInput').value.trim();
        const err = document.getElementById('lockMsg');
        
        if(pin.length < 4) { 
            err.innerText = "الرمز يجب ألا يقل عن 4 أرقام"; 
            err.style.display="block"; 
            return; 
        }

        if(!user.private_pin) {
            user.private_pin = pin;
            try {
                await fetch(`https://aziztest-a0f6c-default-rtdb.firebaseio.com/clients/${clientIdx}.json`, { 
                    method: 'PATCH', 
                    body: JSON.stringify({ private_pin: pin }) 
                });
                localStorage.setItem(`vulture_pin_${user.name}`, pin);
                showDashboard();
            } catch(e) {
                alert("خطأ أثناء الاتصال بالسحابة، حاول مجدداً.");
            }
        } else {
            if(pin === user.private_pin) {
                localStorage.setItem(`vulture_pin_${user.name}`, pin);
                showDashboard();
            } else {
                err.innerText = "رمز التحقق غير صحيح! راجع الإدارة"; 
                err.style.display="block";
            }
        }
    }

    function showDashboard() {
        document.getElementById('lockScreen').style.display = "none";
        document.getElementById('clientContent').style.display = "flex";

        document.getElementById('clientName').innerText = user.name;
        document.getElementById('infoUser').innerText = user.cu || '---';
        document.getElementById('infoPass').innerText = user.ck || '---';
        document.getElementById('infoEnd').innerText = user.ce || '---';
        document.getElementById('storeBtn').href = `store.html?name=${encodeURIComponent(user.name)}`;

        // عرض الرابط الخاص أو التوجه للرابط العام إذا كان الحقل فارغاً
        const myLink = (user.cl && user.cl.trim() !== "") ? user.cl : (cloudData.globalLink || "");

        document.getElementById('activeLinksContainer').innerHTML = `
            <a href="${myLink}" target="_blank" class="btn-download">
                <i class="fas fa-link"></i> الدخول إلى الرابط الفعال
            </a>
        `;

        const updateUI = () => {
            const now = Date.now(), end = new Date(user.ce).getTime(), left = end - now;
            const days = Math.max(0, Math.ceil(left / 86400000));
            document.getElementById('daysCount').innerText = days;
            document.getElementById('barConsumed').style.width = Math.max(0, 100 - (days/3.65)) + "%";
            if(left > 0) {
                const s=Math.floor(left/1000), m=Math.floor(s/60), h=Math.floor(m/60), dL=Math.floor(h/24);
                const units = [['ثانية', s%60], ['دقيقة', m%60], ['ساعة', h%24], ['يوم', dL%30], ['شهر', Math.floor(dL/30)]];
                document.getElementById('timerGrid').innerHTML = units.map(u => `<div class="t-box"><b>${u[1]}</b><span>${u[0]}</span></div>`).reverse().join('');
            }
        };
        updateUI(); setInterval(updateUI, 1000);
    }

    async function triggerReset() {
        if(confirm("هل تريد إعادة تعيين الرمز؟")) {
            try {
                await fetch(`https://aziztest-a0f6c-default-rtdb.firebaseio.com/clients/${clientIdx}/private_pin.json`, { method: 'DELETE' });
                localStorage.removeItem(`vulture_pin_${user.name}`);
                window.location.reload();
            } catch(e) {
                alert("فشل الاتصال، حاول مجدداً.");
            }
        }
    }

    function msg(t) { const e = document.getElementById('lockScreen'); if(e) e.innerHTML = `<div class="lock-card" style="color:var(--danger); font-weight:bold;"><i class="fas fa-exclamation-triangle" style="font-size:2.5rem; margin-bottom:10px;"></i><br>${t}</div>`; }

    init();
</script>
</body>
</html>
