<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة اشتراك فولتشر 🦅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main: #4a4ae2; --success: #28a745; --danger: #dc3545; --bg: #f0f2f5; --wa: #075E54; --soft-red: #f87171; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .lock-card { background: white; padding: 35px 20px; border-radius: 25px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 8px solid var(--main); }
        .pin-input { width: 80%; padding: 15px; border-radius: 15px; border: 2px solid #ddd; text-align: center; font-size: 1.5rem; margin: 20px 0; outline: none; }
        .card { display: none; background: white; width: 100%; max-width: 400px; border-radius: 25px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 8px solid var(--success); border-bottom: 8px solid var(--success); }
        .top-info { display: flex; justify-content: center; gap: 20px; padding: 20px; border-bottom: 1px solid #eee; align-items: center; }
        .date-box { border: 2.5px solid var(--danger); border-radius: 18px; padding: 10px 15px; text-align: center; min-width: 90px; }
        .date-box b { font-size: 1.8rem; color: #f87171; line-height: 1; display: block; }
        .main-logo { width: 70px; height: auto; border-radius: 15px; object-fit: contain; }
        .welcome-msg { padding: 20px; text-align: center; }
        .v-family { color: var(--danger); font-weight: bold; font-size: 1.4rem; display: block; margin-top: 8px; padding-bottom: 15px; border-bottom: 1px solid #eee; margin-bottom: 15px; }
        @keyframes warmHandshake { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.3); } 80% { transform: scale(1.15); } }
        .pulsing-handshake { display: inline-block; font-size: 1.3rem; animation: warmHandshake 2s infinite ease-in-out; }
        @keyframes strongGlow { 0%, 100% { transform: scale(1); text-shadow: 0 0 2px var(--danger); } 50% { transform: scale(1.2); text-shadow: 0 0 10px var(--danger); } }
        .days-glow { display: inline-block; color: var(--danger); font-weight: 900; font-size: 1.3rem; animation: strongGlow 1.2s infinite ease-in-out; margin: 0 5px; }
        .status-line { font-weight: bold; font-size: 0.95rem; color: #333; padding: 0 20px; text-align: right; }
        .prog-static { height: 14px; background: var(--success); border-radius: 10px; overflow: hidden; margin: 10px 20px; position: relative; }
        .fill-red { height: 100%; background: var(--danger); width: 0%; float: right; transition: 0.5s linear; }
        .data-section { padding: 0 20px; }
        .data-row { background: #f9f9f9; border-radius: 12px; padding: 10px 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #f0f0f0; }
        .data-label { font-size: 0.75rem; color: var(--soft-red); font-weight: 600; }
        .data-value { font-size: 0.85rem; font-weight: bold; color: #333; word-break: break-all; }
        .copy-btn { color: var(--soft-red); cursor: pointer; padding: 5px; font-size: 1.1rem; }
        .timer-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 15px 0; direction: ltr; }
        .t-box { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 8px 2px; text-align: center; }
        .t-box b { display: block; color: var(--soft-red); font-size: 1.1rem; }
        .t-box span { font-size: 0.6rem; color: #000; font-weight: bold; }
        .action-btns { padding: 10px 25px 25px 25px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; border-radius: 12px; color: white; font-weight: bold; margin-bottom: 12px; text-decoration: none; text-align: center; font-size: 0.95rem; border: none; cursor: pointer; box-sizing: border-box; }
        .btn i { font-size: 1.2rem; min-width: 20px; }
        .btn-support { background: var(--success); }
        .btn-wa-channel { background: #075E54; }
        .btn-store { background: #5e4cc1; }
        .btn-reset { background: #6c757d; font-size: 0.8rem; padding: 10px; }
        .footer-rights { margin-top: 10px; text-align: center; color: #d1d1d1; font-size: 0.75rem; padding-bottom: 20px; }
    </style>
</head>
<body>
    <div id="lockScreen">
        <div class="lock-card">
            <i class="fas fa-shield-alt" style="font-size: 3.5rem; color: #4a4ae2;"></i>
            <h2 id="lockTitle" style="margin-top:15px;">تحقق آمن</h2>
            <p id="lockDesc">يرجى إدخال الرمز الخاص بك</p>
            <input type="password" id="pinInput" class="pin-input" placeholder="****">
            <button onclick="handleAuth()" class="btn" style="background: #4a4ae2;">دخول</button>
            <div id="errorMsg" style="color:var(--danger); margin-top:10px; font-weight:bold; display:none;"></div>
        </div>
    </div>
    <div id="mainCard" class="card">
        <div class="top-info">
            <div class="date-box">
                <span id="dayName" style="font-size:0.75rem; color:#666; font-weight:bold;"></span><br>
                <b id="dayNum"></b>
                <span id="monthName" style="font-size:0.75rem; color:#666; font-weight:bold;"></span>
            </div>
            <img id="userLogo" src="" class="main-logo">
        </div>
        <div class="welcome-msg">
            <div style="font-size: 1.1rem;">مرحباً بك <span class="pulsing-handshake">🤝</span> <span id="userName" style="font-weight:bold;"></span></div>
            <div style="margin: 10px 0;">سعدنا بانضمامك معنا في</div>
            <div class="v-family">أسرة فولتشر 🦅</div>
        </div>
        <div class="status-line">✅ اشتراك ساري | باقي <span id="daysCount" class="days-glow">0</span> يوم</div>
        <div class="prog-static"><div id="barConsumed" class="fill-red"></div></div>
        <div class="data-section">
            <div id="dataFields"></div>
            <div class="timer-grid" id="timerGrid"></div>
        </div>
        <div class="action-btns">
            <a href="https://wa.me/966594393012" class="btn btn-support"><i class="fab fa-whatsapp"></i> الدعم الفني المباشر</a>
            <a href="https://whatsapp.com/channel/0029VaFYcHcAO7RGw0O0QM1E" class="btn btn-wa-channel"><i class="fas fa-bullhorn"></i> قناة فولتشر بالواتساب</a>
            <a href="store.html" class="btn btn-store"><i class="fas fa-th-large"></i> متجر تطبيقات فولتشر</a>
            <button onclick="triggerReset()" class="btn btn-reset"><i class="fas fa-key"></i> إعادة تعيين الرمز الخاص</button>
        </div>
    </div>
    <div class="footer-rights">أبو نواف - فولتشر 🦅<br>جميع الحقوق محفوظة 2026 ©</div>
    <script>
        const DB_URL = "https://aziztest-a0f6c-default-rtdb.firebaseio.com/.json";
        const MASTER_KEY = "Aztlg1512";
        let target = new URLSearchParams(window.location.search).get('name');
        let fullData = null;
        let clientIdx = -1;
        let user = null;
        let globalLink = "---";

        const d = new Date();
        document.getElementById('dayNum').innerText = d.getDate();
        document.getElementById('dayName').innerText = d.toLocaleString('ar-SA', {weekday: 'long'});
        document.getElementById('monthName').innerText = d.toLocaleString('ar-SA', {month: 'long'});

        async function init() {
            if(!target) return;
            try {
                const res = await fetch(`${DB_URL}?t=${Date.now()}`);
                fullData = await res.json();
                if(fullData) {
                    if(fullData.logo) document.getElementById('userLogo').src = fullData.logo;
                    if(fullData.logoSize) document.getElementById('userLogo').style.width = fullData.logoSize + "px";
                    
                    globalLink = fullData.globalUrl || "---";
                    
                    clientIdx = (fullData.clients || []).findIndex(u => u && u.name === target);
                    if(clientIdx !== -1) {
                        user = fullData.clients[clientIdx];
                        document.getElementById('userName').innerText = user.name;
                        if(!user.private_pin) {
                            document.getElementById('lockTitle').innerText = "إنشاء رمز خاص";
                            document.getElementById('lockDesc').innerText = "قم بتعيين 4 أرقام لحماية صفحتك.";
                            document.getElementById('pinInput').maxLength = 4;
                        }
                    }
                }
            } catch(e) { console.error(e); }
        }

        async function handleAuth() {
            const res = await fetch(`${DB_URL}?t=${Date.now()}`);
            fullData = await res.json();
            
            clientIdx = (fullData.clients || []).findIndex(u => u && u.name === target);
            user = fullData.clients[clientIdx];
            globalLink = fullData.globalUrl || "---";
            
            const val = document.getElementById('pinInput').value.trim();

            if(val === MASTER_KEY) { bootApp(); return; }
            if(!user.private_pin) {
                if(val.length !== 4) { msg("يجب أن يكون الرمز 4 أرقام"); return; }
                
                fullData.clients[clientIdx].private_pin = val;
                await fetch("https://aziztest-a0f6c-default-rtdb.firebaseio.com/.json", { method: 'PUT', body: JSON.stringify(fullData) });
                
                user.private_pin = val; 
                bootApp();
            } else {
                if(val === user.private_pin) { bootApp(); }
                else { msg("الرمز غير صحيح!"); }
            }
        }

        function bootApp() {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('mainCard').style.display = 'block';
            
            const finalLink = (user.cl && user.cl.trim() !== "") ? user.cl : globalLink;

            const fields = [
                ['الجوال', user.cp || '--'],
                ['اسم المستخدم', user.cu || '--'],
                ['الرقم السري', user.ck || '--'],
                ['رابط الدخول', finalLink],
                ['تاريخ بدايتك معنا 🥳', user.cs || '--'],
                ['تاريخ نهاية اشتراكك 😭', user.ce || '--']
            ];
            
            document.getElementById('dataFields').innerHTML = fields.map((f, i) => `
                <div class="data-row">
                    <div><span class="data-label">${f[0]}</span><div class="data-value" id="val${i}">${f[1]}</div></div>
                    <i class="far fa-copy copy-btn" onclick="copyText('val${i}')"></i>
                </div>
            `).join('');

            const updateUI = () => {
                const now = Date.now(), end = new Date(user.ce).getTime(), left = end - now;
                const days = Math.max(0, Math.ceil(left / 86400000));
                document.getElementById('daysCount').innerText = days;
                document.getElementById('barConsumed').style.width = Math.max(0, 100 - (days/3.65)) + "%";
                if(left > 0) {
                    const s=Math.floor(left/1000), m=Math.floor(s/60), h=Math.floor(m/60), dL=Math.floor(h/24);
                    const units = [['ثانية', s%60], ['دقيقة', m%60], ['ساعة', h%24], ['يوم', dL%30], ['شهر', Math.floor(dL/30)]];
                    document.getElementById('timerGrid').innerHTML = units.map(u => `<div class="t-box"><b>${u[1]}</b><span>${u[0]}</span></div>`).reverse().join('');
                }
            };
            updateUI(); setInterval(updateUI, 1000);
        }

        async function triggerReset() {
            if(confirm("هل تريد إعادة تعيين الرمز؟")) {
                const res = await fetch(`${DB_URL}?t=${Date.now()}`);
                let freshData = await res.json();
                let idx = (freshData.clients || []).findIndex(u => u && u.name === target);
                if(idx !== -1) {
                    delete freshData.clients[idx].private_pin;
                    await fetch("https://aziztest-a0f6c-default-rtdb.firebaseio.com/.json", { method: 'PUT', body: JSON.stringify(freshData) });
                }
                window.location.reload();
            }
        }

        function msg(t) { const e = document.getElementById('errorMsg'); e.innerText = t; e.style.display = 'block'; }
        function copyText(id) { navigator.clipboard.writeText(document.getElementById(id).innerText); alert("تم النسخ!"); }
        init();
    </script>
</body>
</html>
