<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر تطبيقات فولتشر 🦅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main: #4a4ae2; --s: #28a745; --bg: #f0f2f5; --txt: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; direction: rtl; }
        
        .header { text-align: center; padding: 20px 0; color: var(--main); }
        .header h1 { margin: 0; font-size: 1.5rem; }

        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        
        /* كرت التطبيق المطور */
        .app-card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #eee; display: flex; flex-direction: column; }
        
        .app-top { display: flex; gap: 15px; align-items: center; margin-bottom: 12px; }
        .app-icon { width: 65px; height: 65px; border-radius: 15px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .app-title { font-weight: bold; font-size: 1.1rem; color: var(--main); flex: 1; }

        .app-desc { font-size: 0.85rem; color: #666; line-height: 1.4; margin-bottom: 15px; background: #f9f9f9; padding: 8px; border-radius: 10px; }

        /* حقول البيانات مع زر النسخ */
        .info-row { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #f0f0f0; padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; }
        .info-label { font-size: 0.75rem; color: #888; flex: 1; }
        .info-value { font-size: 0.85rem; font-weight: bold; color: #222; margin-left: 10px; word-break: break-all; }
        
        .copy-btn { color: var(--s); cursor: pointer; transition: 0.2s; padding: 5px; }
        .copy-btn:active { transform: scale(1.2); color: var(--main); }

        .btn-download { background: var(--main); color: white; text-align: center; padding: 12px; border-radius: 12px; text-decoration: none; font-weight: bold; margin-top: 10px; display: block; font-size: 0.9rem; }
        .back-btn { display: inline-block; margin-bottom: 15px; color: #666; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="header">
    <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-right"></i> العودة للبطاقة</a>
    <h1>متجر تطبيقات فولتشر 🦅</h1>
</div>

<div class="app-grid" id="storeContainer">
    </div>

<script>
    const DB_URL = "https://aziztest-a0f6c-default-rtdb.firebaseio.com/.json";

    async function loadStore() {
        try {
            const res = await fetch(DB_URL);
            const data = await res.json();
            const apps = data.apps || [];
            const container = document.getElementById('storeContainer');

            if (apps.length === 0) {
                container.innerHTML = "<p style='text-align:center; width:100%; color:#888;'>لا توجد تطبيقات حالياً</p>";
                return;
            }

            container.innerHTML = apps.map((app, i) => `
                <div class="app-card">
                    <div class="app-top">
                        <img src="${app.img || 'https://via.placeholder.com/100'}" class="app-icon">
                        <div class="app-title">${app.name}</div>
                    </div>
                    
                    <div class="app-desc">${app.at || 'لا يوجد وصف متاح لهذا التطبيق.'}</div>

                    <div class="info-row">
                        <span class="info-label">كود داونلودر:</span>
                        <span class="info-value" id="code-${i}">${app.ad}</span>
                        <i class="far fa-copy copy-btn" onclick="copyText('code-${i}')" title="نسخ الكود"></i>
                    </div>

                    <div class="info-row">
                        <span class="info-label">رابط التحميل:</span>
                        <span class="info-value" id="url-${i}" style="max-width:150px; overflow:hidden; text-overflow:ellipsis;">${app.al}</span>
                        <i class="far fa-copy copy-btn" onclick="copyText('url-${i}', '${app.al}')" title="نسخ الرابط"></i>
                    </div>

                    <a href="${app.al}" target="_blank" class="btn-download">
                        <i class="fas fa-download"></i> تحميل الآن
                    </a>
                </div>
            `).join('');
        } catch (e) {
            console.error("Error loading store:", e);
        }
    }

    function copyText(id, fullText = null) {
        const text = fullText ? fullText : document.getElementById(id).innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("تم النسخ بنجاح!");
        });
    }

    loadStore();
</script>
</body>
</html>
