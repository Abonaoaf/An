<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة فولتشر الشاملة 🦅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --p: #1a202c; --blue: #3182ce; --bg: #f7fafc; --gray: #e2e8f0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        
        /* شاشة الحماية الفخمة */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #3182ce; display: flex; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; color: white; }
        #loginOverlay input { padding: 15px; border-radius: 15px; border: none; width: 260px; text-align: center; font-size: 1.1rem; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #loginOverlay button { padding: 12px 40px; border-radius: 15px; border: 2px solid white; background: transparent; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        #loginOverlay button:hover { background: white; color: #3182ce; }

        /* الهيدر والتبويبات كما في الصورة */
        .header { background: white; padding: 20px; text-align: center; border-bottom: 1px solid #edf2f7; }
        .nav-tabs { display: flex; justify-content: center; gap: 12px; margin-top: 15px; }
        .tab-btn { padding: 12px 25px; border-radius: 15px; border: 1px solid var(--gray); background: white; cursor: pointer; font-weight: bold; color: #4a5568; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .tab-btn.active { background: var(--blue); color: white; border-color: var(--blue); box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3); }

        .container { padding: 20px; max-width: 600px; margin: auto; }
        .section { display: none; }
        .section.active { display: block; }

        /* نموذج الإضافة كما في الصورة */
        .modal { background: white; border-radius: 25px; padding: 30px; border: 2px dashed #cbd5e0; margin-top: 20px; }
        .modal h2 { margin-top: 0; font-size: 1.4rem; color: #2d3748; margin-bottom: 25px; }
        
        input, textarea { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid var(--gray); border-radius: 15px; box-sizing: border-box; background: #fff; font-size: 0.95rem; color: #4a5568; text-align: right; }
        input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1); }
        
        .btn-main { background: var(--blue); color: white; width: 100%; padding: 15px; border-radius: 15px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-main:hover { background: #2c5282; }

        /* الكروت والنتائج */
        .grid { margin-top: 30px; }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #edf2f7; display: flex; flex-direction: column; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        
        .prog-mini { height: 10px; background: #edf2f7; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .fill-red { height: 100%; background: #e53e3e; float: right; }

        .actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-sm { padding: 8px 15px; border-radius: 10px; border: none; font-size: 0.85rem; font-weight: bold; cursor: pointer; flex: 1; text-align: center; text-decoration: none; }
        .btn-edit { background: #f0fff4; color: #38a169; border: 1px solid #c6f6d5; }
        .btn-link { background: #ebf8ff; color: #3182ce; border: 1px solid #bee3f8; }
        .btn-del { background: #fff5f5; color: #e53e3e; border: 1px solid #fed7d7; }

        /* المتجر */
        .app-item { display: flex; align-items: center; gap: 15px; background: white; padding: 15px; border-radius: 20px; border: 1px solid #edf2f7; margin-bottom: 10px; }
        .app-item img { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <i class="fas fa-lock" style="font-size: 3rem; margin-bottom: 20px;"></i>
    <h2 style="margin-bottom: 20px;">دخول آمن للمشرف</h2>
    <input type="password" id="passInput" placeholder="كلمة المرور">
    <button onclick="checkPass()">دخول 🦅</button>
</div>

<div id="appContainer" style="display:none;">
    <div class="header">
        <div style="font-weight:bold; font-size: 1.2rem;">إدارة فولتشر الشاملة 🦅</div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('clients', this)"><i class="fas fa-users"></i> المشتركين</button>
            <button class="tab-btn" onclick="switchTab('store', this)"><i class="fas fa-store"></i> المتجر</button>
            <button class="tab-btn" onclick="switchTab('settings', this)"><i class="fas fa-cog"></i> الإعدادات</button>
        </div>
    </div>

    <div class="container">
        <div id="clients" class="section active">
            <div class="modal">
                <h2 id="cTitle">إضافة مشترك جديد</h2>
                <input type="hidden" id="editIdx">
                <input type="text" id="cn" placeholder="اسم العميل (بالضبط كما في الرابط)">
                <input type="text" id="cp" placeholder="رقم الجوال">
                <input type="text" id="cu" placeholder="اسم المستخدم">
                <input type="text" id="ck" placeholder="الرقم السري">
                <input type="text" id="cl" placeholder="رابط الدخول">
                <div style="display:flex; gap:10px;">
                    <input type="date" id="cs" title="البداية" style="flex:1">
                    <input type="date" id="ce" title="النهاية" style="flex:1">
                </div>
                <button class="btn-main" onclick="saveClient()">حفظ في السحابة</button>
            </div>
            <div id="clientGrid" class="grid"></div>
        </div>

        <div id="store" class="section">
            <div class="modal">
                <h2 id="aTitle">+ إضافة تطبيق للمتجر</h2>
                <input type="hidden" id="editAppIdx">
                <input type="file" id="appIcon" accept="image/*">
                <input type="text" id="an" placeholder="اسم التطبيق">
                <input type="text" id="ad" placeholder="كود دونلودر">
                <input type="text" id="al" placeholder="رابط التحميل المباشر">
                <textarea id="at" placeholder="وصف التطبيق"></textarea>
                <button class="btn-main" onclick="saveApp()">حفظ في المتجر</button>
            </div>
            <div id="appList" class="grid"></div>
        </div>

        <div id="settings" class="section">
            <div class="modal" style="text-align:center;">
                <h2>تحديث لوقو المنصة</h2>
                <input type="file" id="logoFile" accept="image/*">
                <button class="btn-main" onclick="saveLogo()">رفع اللوقو الآن</button>
            </div>
        </div>
    </div>
</div>

<script>
    const DB = "https://aziztest-a0f6c-default-rtdb.firebaseio.com/.json";
    const MASTER_PASS = "Aztlg1512";
    let cloudData = { clients: [], apps: [], logo: "" };

    function checkPass() {
        if(document.getElementById('passInput').value === MASTER_PASS) {
            document.getElementById('loginOverlay').style.display = "none";
            document.getElementById('appContainer').style.display = "block";
            load();
        } else { alert("كلمة المرور خاطئة!"); }
    }

    async function load() {
        const r = await fetch(DB);
        const d = await r.json();
        if (d) cloudData = d;
        renderClients();
        renderApps();
    }

    function switchTab(id, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    function renderClients() {
        const grid = document.getElementById('clientGrid');
        grid.innerHTML = (cloudData.clients || []).map((c, i) => {
            const now = new Date().getTime(), st = new Date(c.cs).getTime(), en = new Date(c.ce).getTime();
            const p = Math.max(0, Math.min(100, ((now - st) / (en - st)) * 100));
            return `<div class="card">
                <div class="card-header"><b>${c.name}</b> <span style="font-size:0.7rem; color:#666;">${c.ce}</span></div>
                <div class="prog-mini"><div class="fill-red" style="width:${p}%"></div></div>
                <div class="actions">
                    <button class="btn-sm btn-edit" onclick="editClient(${i})">تعديل</button>
                    <button class="btn-sm btn-link" onclick="copyL('${c.name}')">نسخ الرابط</button>
                    <button class="btn-sm btn-del" onclick="delClient(${i})">حذف</button>
                </div>
            </div>`;
        }).join('');
    }

    async function saveClient() {
        const idx = document.getElementById('editIdx').value;
        const d = { name:v('cn'), cp:v('cp'), cu:v('cu'), ck:v('ck'), cl:v('cl'), cs:v('cs'), ce:v('ce') };
        if(!cloudData.clients) cloudData.clients = [];
        if(idx === "") cloudData.clients.push(d); else cloudData.clients[idx] = d;
        await sync(); clearC();
    }

    function renderApps() {
        const list = document.getElementById('appList');
        list.innerHTML = (cloudData.apps || []).map((a, i) => `
            <div class="app-item">
                <img src="${a.img || ''}">
                <div style="flex:1;"><b>${a.name}</b></div>
                <div class="actions" style="margin:0;">
                    <button class="btn-sm btn-edit" onclick="editApp(${i})">تعديل</button>
                    <button class="btn-sm btn-del" onclick="delApp(${i})">حذف</button>
                </div>
            </div>
        `).join('');
    }

    async function saveApp() {
        const idx = document.getElementById('editAppIdx').value;
        const file = document.getElementById('appIcon').files[0];
        const process = async (img) => {
            const d = { name:v('an'), ad:v('ad'), al:v('al'), at:v('at'), img: img || (idx!==""?cloudData.apps[idx].img:"") };
            if(!cloudData.apps) cloudData.apps = [];
            if(idx==="") cloudData.apps.push(d); else cloudData.apps[idx]=d;
            await sync(); clearA();
        };
        if(file) { const r=new FileReader(); r.onload=()=>process(r.result); r.readAsDataURL(file); } else process();
    }

    async function sync() { await fetch(DB, { method: 'PUT', body: JSON.stringify(cloudData) }); load(); }
    
    function copyL(name) {
        const link = window.location.href.replace('index.html','') + 'user.html?name=' + encodeURIComponent(name);
        navigator.clipboard.writeText(link); alert("تم النسخ بنجاح!");
    }

    function editClient(i) {
        const c = cloudData.clients[i]; document.getElementById('editIdx').value = i;
        ['cn','cp','cu','ck','cl','cs','ce'].forEach(id => document.getElementById(id).value = c[id] || "");
        document.getElementById('cTitle').innerText = "تعديل: " + c.name;
        window.scrollTo(0,0);
    }

    function editApp(i) {
        const a = cloudData.apps[i]; document.getElementById('editAppIdx').value = i;
        ['an','ad','al','at'].forEach(id => document.getElementById(id).value = a[id] || "");
        document.getElementById('aTitle').innerText = "تعديل: " + a.name;
        window.scrollTo(0,0);
    }

    async function delClient(i) { if(confirm("حذف؟")) { cloudData.clients.splice(i,1); await sync(); } }
    async function delApp(i) { if(confirm("حذف؟")) { cloudData.apps.splice(i,1); await sync(); } }
    function v(id) { return document.getElementById(id).value; }
    function clearC() { ['cn','cp','cu','ck','cl','cs','ce','editIdx'].forEach(id=>document.getElementById(id).value=""); document.getElementById('cTitle').innerText="إضافة مشترك جديد"; }
    function clearA() { ['an','ad','al','at','editAppIdx'].forEach(id=>document.getElementById(id).value=""); document.getElementById('appIcon').value=""; document.getElementById('aTitle').innerText="+ إضافة تطبيق جديد"; }
    
    function saveLogo() {
        const file = document.getElementById('logoFile').files[0];
        const r = new FileReader(); r.onload=async()=>{ cloudData.logo=r.result; await sync(); alert("تم التحديث!"); };
        r.readAsDataURL(file);
    }
</script>
</body>
</html>
