<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم فولتشر 🦅</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 5px; border-radius: 5px; border: 1px solid #ddd; width: 80%; }
        button { background: #4a4ae2; color: white; cursor: pointer; font-weight: bold; width: auto; padding: 10px 30px; }
        .client-card { border: 1px solid #eee; padding: 15px; margin: 10px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .btn-del { background: #dc3545; }
        .btn-copy { background: #28a745; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #4a4ae2; display: flex; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; color: white; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <h2>🦅 لوحة تحكم فولتشر</h2>
    <input type="password" id="passInput" placeholder="أدخل كلمة المرور للدخول">
    <button onclick="checkPass()">دخول</button>
</div>

<div class="container" id="mainContent" style="display:none;">
    <h2>إضافة مشترك جديد</h2>
    <input type="text" id="n" placeholder="اسم العميل (بالضبط كما في الرابط)">
    <input type="date" id="cs" title="تاريخ البداية">
    <input type="date" id="ce" title="تاريخ النهاية">
    <input type="text" id="cp" placeholder="رقم الجوال">
    <input type="text" id="cu" placeholder="اسم المستخدم">
    <input type="text" id="ck" placeholder="كلمة السر">
    <input type="text" id="cl" placeholder="رابط الدخول">
    <button onclick="add()">إضافة العميل</button>

    <hr>
    <h3>المشتركون الحاليون</h3>
    <div id="list"></div>
</div>

<script>
    const DB_URL = "https://aziztest-a0f6c-default-rtdb.firebaseio.com/.json";
    const MASTER_PASS = "Aztlg1512"; // كلمة المرور الخاصة بك

    function checkPass() {
        const input = document.getElementById('passInput').value;
        if (input === MASTER_PASS) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            load();
        } else {
            alert("كلمة المرور خاطئة!");
        }
    }

    async function load() {
        try {
            const res = await fetch(DB_URL);
            const data = await res.json();
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = '';
            (data.clients || []).forEach((c, i) => {
                listDiv.innerHTML += `
                    <div class="client-card">
                        <div>
                            <b>${c.name}</b> - ينتهي في: ${c.ce}
                        </div>
                        <div>
                            <button class="btn-copy" onclick="copyLink('${c.name}')">نسخ الرابط</button>
                            <button class="btn-del" onclick="del(${i})">حذف</button>
                        </div>
                    </div>`;
            });
        } catch (e) { console.error("Error loading"); }
    }

    async function add() {
        const newUser = {
            name: document.getElementById('n').value,
            cs: document.getElementById('cs').value,
            ce: document.getElementById('ce').value,
            cp: document.getElementById('cp').value,
            cu: document.getElementById('cu').value,
            ck: document.getElementById('ck').value,
            cl: document.getElementById('cl').value
        };
        
        const res = await fetch(DB_URL);
        const data = await res.json() || { clients: [] };
        data.clients = data.clients || [];
        data.clients.push(newUser);

        await fetch(DB_URL, { method: 'PUT', body: JSON.stringify(data) });
        alert("تمت الإضافة!");
        load();
    }

    async function del(index) {
        if(!confirm("هل أنت متأكد من الحذف؟")) return;
        const res = await fetch(DB_URL);
        const data = await res.json();
        data.clients.splice(index, 1);
        await fetch(DB_URL, { method: 'PUT', body: JSON.stringify(data) });
        load();
    }

    function copyLink(name) {
        const link = `https://${window.location.hostname}/user.html?name=${encodeURIComponent(name)}`;
        navigator.clipboard.writeText(link);
        alert("تم نسخ رابط العميل!");
    }
</script>
</body>
</html>
