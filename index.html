<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة اشتراك فولتشر 🦅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main: #4a4ae2; --success: #28a745; --danger: #dc3545; --bg: #f0f2f5; --wa: #075E54; --soft-red: #f87171; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .lock-card { background: white; padding: 35px 20px; border-radius: 25px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 8px solid var(--main); }
        .pin-input { width: 80%; padding: 15px; border-radius: 15px; border: 2px solid #ddd; text-align: center; font-size: 1.5rem; margin: 20px 0; outline: none; }

        .card { display: none; background: white; width: 100%; max-width: 400px; border-radius: 25px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 8px solid var(--success); border-bottom: 8px solid var(--success); }
        .top-info { display: flex; justify-content: center; gap: 20px; padding: 20px; border-bottom: 1px solid #eee; align-items: center; }
        .date-box { border: 2.5px solid var(--danger); border-radius: 18px; padding: 10px 15px; text-align: center; min-width: 90px; }
        .date-box b { font-size: 1.8rem; color: #f87171; line-height: 1; display: block; }
        
        .welcome-msg { padding: 20px; text-align: center; }
        .v-family { color: var(--danger); font-weight: bold; font-size: 1.4rem; display: block; margin: 8px 0; }

        /* حركة نبض الأيام */
        @keyframes strongGlow { 0%, 100% { transform: scale(1); text-shadow: 0 0 2px var(--danger); } 50% { transform: scale(1.1); text-shadow: 0 0 10px var(--danger); } }
        .days-glow { color: var(--danger); font-weight: 900; font-size: 1.3rem; display: inline-block; animation: strongGlow 1.2s infinite ease-in-out; margin: 0 5px; }

        /* شريط التقدم */
        .prog-static { height: 16px; background: var(--success); border-radius: 10px; overflow: hidden; margin: 10px 20px; border: 1px solid #eee; position: relative; }
        .fill-red { height: 100%; background: var(--danger); width: 0%; float: right; transition: 0.5s linear; }

        .data-row { background: #f9f9f9; border-radius: 12px; padding: 10px 15px; margin: 8px 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #f0f0f0; }
        
        /* عداد الوقت الرقمي */
        .timer-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 15px 20px; direction: ltr; }
        .t-box { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 8px 2px; text-align: center; }
        .t-box b { display: block; color: var(--soft-red); font-size: 1rem; }
        .t-box span { font-size: 0.6rem; color: #666; font-weight: bold; }

        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 90%; margin: 10px auto; padding: 14px; border-radius: 12px; color: white; font-weight: bold; text-decoration: none; border: none; cursor: pointer; }
        .footer-rights { margin-top: 15px; text-align: center; color: #d1d1d1; font-size: 0.75rem; padding-bottom: 20px; }
    </style>
</head>
<body>

    <div id="lockScreen">
        <div class="lock-card">
            <i class="fas fa-shield-alt" style="font-size: 3.5rem; color: var(--main);"></i>
            <h2 id="lockTitle">تحقق آمن 🦅</h2>
            <p id="lockDesc">أدخل رمز القفل الخاص بك</p>
            <input type="password" id="pinInput" class="pin-input" placeholder="****" maxlength="4">
            <button onclick="handleAuth()" class="btn" style="background: var(--main); width: 100%;">دخول</button>
            <div id="errorMsg" style="color:var(--danger); margin-top:10px; display:none;"></div>
        </div>
    </div>

    <div id="ticker" style="display:none; width:100%; background:#fff; padding:8px 0; border-bottom:1px solid #eee;">
        <marquee behavior="scroll" direction="right" id="msgText" style="color:var(--danger); font-weight:bold; font-size:0.9rem;"></marquee>
    </div>

    <div id="mainCard" class="card">
        <div class="top-info">
            <div class="date-box">
                <span id="dayName" style="font-size:0.7rem; color:#666; font-weight:bold;"></span><br>
                <b id="dayNum"></b>
                <span id="monthName" style="font-size:0.7rem; color:#666; font-weight:bold;"></span>
            </div>
            <img id="userLogo" src="" style="width:70px; border-radius:12px;">
        </div>

        <div class="welcome-msg">
            <div style="font-size: 1.1rem;">مرحباً بك <span id="userName" style="font-weight:bold;"></span> 🤝</div>
            <div class="v-family">أسرة فولتشر 🦅</div>
        </div>

        <div style="font-weight:bold; padding:0 20px; text-align:right; font-size:0.9rem;">
            ✅ اشتراك ساري | باقي <span id="daysCount" class="days-glow">0</span> يوم
        </div>

        <div class="prog-static"><div id="barConsumed" class="fill-red"></div></div>

        <div id="dataFields"></div>
        
        <div class="timer-grid" id="timerGrid"></div>

        <div class="action-btns" style="padding: 10px 0;">
            <a href="https://wa.me/966594393012" class="btn" style="background:var(--success)"><i class="fab fa-whatsapp"></i> الدعم الفني</a>
            <a href="store.html" class="btn" style="background:#5e4cc1"><i class="fas fa-th-large"></i> متجر التطبيقات</a>
        </div>
    </div>
    <div class="footer-rights">أبو نواف - فولتشر 🦅<br>جميع الحقوق محفوظة 2026 ©</div>

    <script>
        const DB_URL = "https://aziztest-a0f6c-default-rtdb.firebaseio.com/";
        const MASTER = "Aztlg1512";
        let clientIdx = -1, user = null, target = new URLSearchParams(window.location.search).get('name');

        // تحديث التاريخ في الكرت
        const d = new Date();
        document.getElementById('dayNum').innerText = d.getDate();
        document.getElementById('dayName').innerText = d.toLocaleString('ar-SA', {weekday: 'long'});
        document.getElementById('monthName').innerText = d.toLocaleString('ar-SA', {month: 'long'});

        async function init() {
            if(!target) return;
            const res = await fetch(`${DB_URL}.json?t=${Date.now()}`); 
            const cloud = await res.json();
            if(cloud.logo) document.getElementById('userLogo').src = cloud.logo;
            if(cloud.news) { document.getElementById('msgText').innerText = cloud.news; document.getElementById('ticker').style.display = 'block'; }
            clientIdx = (cloud.clients || []).findIndex(u => u.name === target);
            if(clientIdx !== -1) { 
                user = cloud.clients[clientIdx]; 
                document.getElementById('userName').innerText = user.name; 
                if(!user.private_pin) { document.getElementById('lockTitle').innerText = "تفعيل القفل"; document.getElementById('lockDesc').innerText = "اختر 4 أرقام لحماية بياناتك"; }
            }
        }

        async function handleAuth() {
            const res = await fetch(`${DB_URL}clients/${clientIdx}.json?t=${Date.now()}`); 
            user = await res.json();
            const val = document.getElementById('pinInput').value;
            if(val === MASTER || (user.private_pin && val === user.private_pin)) { bootApp(); }
            else if(!user.private_pin && val.length === 4) { 
                await fetch(`${DB_URL}clients/${clientIdx}/private_pin.json`, { method: 'PUT', body: JSON.stringify(val) }); 
                user.private_pin = val; bootApp(); 
            } else { document.getElementById('errorMsg').innerText = "الرمز غير صحيح!"; document.getElementById('errorMsg').style.display = 'block'; }
        }

        function bootApp() {
            document.getElementById('lockScreen').style.display='none'; 
            document.getElementById('mainCard').style.display='block';
            
            const fields = [['الجوال', user.cp],['اليوزر', user.cu],['الباسورد', user.ck],['تاريخ النهاية', user.ce]];
            document.getElementById('dataFields').innerHTML = fields.map(x => `
                <div class="data-row"><div><small style="color:var(--soft-red); font-weight:bold;">${x[0]}</small><div style="font-weight:bold;">${x[1]||'--'}</div></div></div>
            `).join('');

            // محرك العداد المصلح
            const updateUI = () => {
                const now = Date.now(), startT = new Date(user.cs).getTime(), endT = new Date(user.ce).getTime();
                const total = endT - startT, left = endT - now;
                const days = Math.max(0, Math.ceil(left / 86400000));
                
                // تحديث نبض الأيام وشريط التقدم
                document.getElementById('daysCount').innerText = days;
                const consumedPercent = Math.max(0, Math.min(100, 100 - (left / total * 100)));
                document.getElementById('barConsumed').style.width = consumedPercent + "%";

                if(left > 0) {
                    const s=Math.floor(left/1000), m=Math.floor(s/60), h=Math.floor(m/60), dL=Math.floor(h/24);
                    const units = [['ثانية', s%60], ['دقيقة', m%60], ['ساعة', h%24], ['يوم', dL%30], ['شهر', Math.floor(dL/30)]];
                    document.getElementById('timerGrid').innerHTML = units.map(u => `<div class="t-box"><b>${u[1]}</b><span>${u[0]}</span></div>`).reverse().join('');
                }
            };
            updateUI(); setInterval(updateUI, 1000);
        }
        init();
    </script>
</body>
</html>
